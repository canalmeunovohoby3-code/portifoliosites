  <text x="100" y="120" fill="#B69247" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="10">RIO DE JANEIRO • FABRICAÇÃO PRÓPRIA</text>

  <text x="94" y="330" fill="#F8F4ED" font-family="Georgia, 'Times New Roman', serif" font-size="150" letter-spacing="42">M O D</text>

