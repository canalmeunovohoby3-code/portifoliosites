  <text x="100" y="576" fill="#B69247" font-family="Verdana, Geneva, sans-serif" font-size="18" letter-spacing="4">MÓVEIS SOB MEDIDA • PROJETO 3D • INSTALAÇÃO ESPECIALIZADA</text>
